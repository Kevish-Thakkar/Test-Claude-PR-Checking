# ============================================
# SonarQube Project
# ============================================

sonar.projectKey=Test
sonar.projectName=Test
sonar.projectVersion=1.0
sonar.pullrequest.key=4
sonar.pullrequest.branch=feature/task-123
sonar.pullrequest.base=master

# ============================================
# Source Code
# ============================================

sonar.sources=src,server.js


# ============================================
# Tests
# ============================================

sonar.tests=test

sonar.test.inclusions=\
test/**/*.test.js,\
test/**/*.spec.js


# ============================================
# Exclusions
# ============================================

sonar.exclusions=\
node_modules/**,\
coverage/**,\
dist/**,\
build/**,\
.env,\
.github/**


# ============================================
# JavaScript Coverage
# ============================================

sonar.javascript.lcov.reportPaths=coverage/lcov.info


# ============================================
# Encoding
# ============================================

sonar.sourceEncoding=UTF-8