- name: Claude Review
  uses: anthropics/claude-code-action@v1
  with:
    anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

    additional_permissions: |
      actions: read

    use_sticky_comment: true

    prompt: |
      REPO: ${{ github.repository }}
      PR NUMBER: ${{ github.event.pull_request.number }}

      Perform a comprehensive code review of this pull request.

      Review the actual changes in the PR.

      Check:

      1. Bugs
      2. Security vulnerabilities
      3. Incorrect logic
      4. Error handling
      5. Null/undefined issues
      6. Async/Promise issues
      7. Performance
      8. Maintainability
      9. Code duplication
      10. Type safety
      11. Missing edge cases

      ## TEST REVIEW

      Determine:

      - What behavior changed?
      - What tests should exist?
      - Are those tests present?
      - What edge cases are missing?
      - Are error cases tested?
      - Are regression tests required?

      If production behavior changed and appropriate tests
      are missing, report it.

      ## OUTPUT

      ## Claude Review Summary

      Status: PASS or CHANGES_REQUESTED

      Critical:
      High:
      Medium:
      Low:

      ## Test Assessment

      Tests found:
      Missing tests:
      Edge cases missing:

      ## CI Assessment

      Tests:
      Lint:
      Typecheck:
      Build:

      ## Final Recommendation

      Explain whether the PR is ready for human review.