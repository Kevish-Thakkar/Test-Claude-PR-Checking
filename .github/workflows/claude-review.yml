- name: Claude PR Review
  uses: anthropics/claude-code-action@v1
  with:
    anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

    claude_args: |
      --max-turns 20

    prompt: |
      REPO: ${{ github.repository }}
      PR NUMBER: ${{ github.event.pull_request.number }}

      Perform a comprehensive pull request review.

      Use the PR review toolkit and review all applicable aspects:

      - General code quality
      - Bugs
      - Test coverage
      - Error handling
      - Type safety
      - Comments/documentation
      - Code simplification

      IMPORTANT:

      Review the actual changes in this PR.

      Do not simply summarize the changes.

      Identify concrete problems that could affect the
      correctness, security, reliability, maintainability,
      or testability of the code.

      For test analysis:

      - Determine what behavior was added or changed.
      - Determine what tests should exist.
      - Check whether those tests exist.
      - Report important missing tests.
      - Check edge cases and error cases.

      Report only actionable findings.

      For every finding provide:

      Severity:
      File:
      Line:
      Category:
      Description:
      Why it matters:
      Recommended fix:

      At the end provide:

      ## Final Review

      Status: PASS or CHANGES_REQUESTED

      Critical issues:
      High issues:
      Medium issues:
      Low issues:

      ## Test Assessment

      Tests found:
      Missing tests:
      Coverage concerns:
